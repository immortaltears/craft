  <!-- Prefer a server-side redirect where possible. Update PACKAGE_URL below. -->
  <script>
    // Replace this with the permanent URL to your exported package or GitHub Pages URL.
    const PACKAGE_URL = "https://packager.turbowarp.org/your-exported-file.html";

    // If PACKAGE_URL is set, perform an accessible redirect.
    if (PACKAGE_URL) {
      // Use replace() so the redirect doesn't add a history entry.
      // Small timeout gives screen readers a moment to announce the status text.
      setTimeout(() => window.location.replace(PACKAGE_URL), 250);
    }
  </script>

  <!-- Fallback for clients without JS; short delay so screen readers can announce -->
  <meta http-equiv="refresh" content="2;url=https://packager.turbowarp.org/your-exported-file.html" />
